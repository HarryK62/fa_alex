[project]
name = "alex-database"
version = "0.1.0"
description = "Database package for Alex Financial Planner on local Postgres"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.107.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
